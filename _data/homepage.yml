profile:
  name: "Jiangyue Zhao"
  location: "Shanghai, China"
  photo: "/images/Jasmine2.jpg"
  photo_alt: "Portrait of Jiangyue Zhao"
  introduction:
    - >-
      Hi! I’m Jiangyue, a senior undergraduate majoring in Data Science at [Shanghai University of Finance and Economics](https://www.sufe.edu.cn/). I am part of the [Pilot Class of Interdisciplinary Science](https://riis.sufe.edu.cn/), where I receive interdisciplinary training in operations research, computer science, and economics.
    - >-
      My research focuses on **AI-enabled decision-making** at the intersection of **Information Systems** and **Operations Management**. I combine AI, optimization, and computational methods to study real-world operational problems and develop actionable insights. My current work centers on two areas: **LLMs for operations research** and **AI-enabled healthcare operations**.
  availability: "I am actively seeking PhD opportunities for Fall 2027! ✨"

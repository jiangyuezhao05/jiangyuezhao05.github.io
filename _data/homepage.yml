    authors: "Chenyu Zhou*, Jiangyue Zhao*, Michael Lingzhi Li, and Pengyi Shi"
    status: "Under Review"
    year: "2026"
    description: >-
      Develops an auditable clinical simulator for sequential sepsis treatment by refining interpretable patient dynamics against observational targets.

